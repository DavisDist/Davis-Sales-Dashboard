<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Aging Dashboard — Davis Distributing</title>
<style>
  :root {
    --bg:#060b14; --surface:#0d1623; --card:#111d2e;
    --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#e2eaf5; --muted:#a0aec0; --accent:#00d4aa;
    --green-bg:#1a2e1a; --green-text:#7ec87e; --green-dot:#4caf50;
    --yellow-bg:#2e2510; --yellow-text:#e8c070; --yellow-dot:#e0a030;
    --red-bg:#2e1010; --red-text:#e87070; --red-dot:#e04040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  /* LOGIN SCREEN */
  #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,212,170,0.08) 0%,transparent 70%); }
  .login-logo { width:180px; height:auto; display:block; margin:0 auto 22px; filter:invert(1); mix-blend-mode:screen; }
  .login-card { width:360px; background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:40px; text-align:center; }
  .login-title { font-size:14px; font-weight:700; margin-bottom:6px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .login-subtitle { font-size:13px; color:var(--muted); margin-bottom:28px; }
  .login-card input[type=password] { width:100%; padding:13px 18px; background:rgba(255,255,255,0.04);
    border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:15px;
    letter-spacing:3px; text-align:center; outline:none; margin-bottom:12px; transition:border .2s; }
  .login-card input[type=password]:focus { border-color:#00d4aa; }
  .login-btn { width:100%; padding:13px; background:#00d4aa; border:none; border-radius:10px;
    color:#001a14; font-weight:800; font-size:13px; letter-spacing:1px; cursor:pointer; transition:opacity .2s; }
  .login-btn:hover { opacity:.85; }
  .login-error { font-size:12px; color:var(--red-text); margin-top:10px; min-height:18px; }
  .login-hint { font-size:11px; color:var(--muted); margin-top:18px; }
  /* CREDIT PANEL */
  .credit-panel-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .credit-panel { background:var(--surface); border:1px solid var(--border2); border-radius:16px; width:100%; max-width:580px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
  .credit-panel-header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:1px solid var(--border); }
  .credit-panel-title { font-size:14px; font-weight:600; color:var(--text); }
  .credit-panel-total { font-size:13px; color:var(--green-text); font-weight:600; }
  .credit-panel-close { background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 4px; line-height:1; }
  .credit-panel-close:hover { color:var(--text); }
  .credit-panel-body { overflow-y:auto; flex:1; }
  .credit-panel-body table { width:100%; border-collapse:collapse; font-size:13px; }
  .credit-panel-body th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:left; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; }
  .credit-panel-body td { padding:9px 14px; border-bottom:1px solid var(--border); color:var(--text); }
  .credit-panel-body tr:last-child td { border-bottom:none; }
  .credit-panel-body tr:hover td { background:var(--card); cursor:pointer; }
  .credit-amt { font-weight:600; color:var(--green-text); text-align:right; }
  /* DASHBOARD */
  #dashboard { display: none; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .header-logo { height:44px; width:auto; filter:invert(1); mix-blend-mode:screen; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  #last-updated { font-size: 11px; color: var(--muted); }
  .signout-btn { font-size: 11px; padding: 4px 12px; border: 1px solid var(--border2); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
  .signout-btn:hover { color: var(--text); border-color: var(--text); }
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 1.25rem; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; transition: border-color .15s; }
  .kpi:hover { border-color: var(--border2); transform: translateY(-1px); }
  .kpi-active { border-color: #aaaaaa !important; box-shadow: 0 0 0 1px #aaaaaa33; }
  .kpi-active-warn { border-color: var(--yellow-dot) !important; box-shadow: 0 0 0 1px rgba(224,160,48,0.2); }
  .kpi-active-danger { border-color: var(--red-dot) !important; box-shadow: 0 0 0 1px rgba(224,64,64,0.2); }
  .kpi { transition: border-color .15s, transform .15s; }
  .kpi-credit { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 600; color: var(--text); }
  .kpi-value.warn { color: var(--yellow-text); }
  .kpi-value.danger { color: var(--red-text); }
  .kpi-sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .bar-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .875rem 1.25rem; margin-bottom: 1.25rem; }
  .bar-label-row { display: flex; gap: 1.5rem; margin-bottom: 8px; font-size: 12px; }
  .bar-legend { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .bar-dot { width: 8px; height: 8px; border-radius: 50%; }
  .bar-row { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .bar-seg { border-radius: 3px; }
  .controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .fpill { font-size: 12px; padding: 5px 14px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--muted); cursor: pointer; }
  .fpill:hover { border-color: var(--border2); color: var(--text); }
  .fpill.active { border-color: var(--accent); color: var(--accent); }
  .search { margin-left: auto; }
  .search input { font-size: 13px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text); width: 200px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr.clickable:hover td { background: var(--card); cursor: pointer; }
  .tnum { text-align: right; font-variant-numeric: tabular-nums; }
  .tr { text-align: right; }
  .zone-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 12px; }
  .z-current { background: var(--green-bg); color: var(--green-text); }
  .z-yellow  { background: var(--yellow-bg); color: var(--yellow-text); }
  .z-red     { background: var(--red-bg); color: var(--red-text); }
  .zdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .z-current .zdot { background: var(--green-dot); }
  .z-yellow  .zdot { background: var(--yellow-dot); }
  .z-red     .zdot { background: var(--red-dot); }
  .chev { font-size: 16px; color: var(--muted); }
  .detail-header { display: flex; align-items: center; gap: 14px; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--bg); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .av-current { background: var(--green-bg); color: var(--green-text); }
  .av-yellow  { background: var(--yellow-bg); color: var(--yellow-text); }
  .av-red     { background: var(--red-bg); color: var(--red-text); }
  .detail-name { font-weight: 600; font-size: 15px; }
  .detail-sub  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .detail-meta { margin-left: auto; text-align: right; display: flex; align-items: center; gap: 8px; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; margin-bottom: 1rem; }
  .tab-row { display: flex; gap: 4px; padding: 0 1.25rem; border-bottom: 1px solid var(--border); background: var(--bg); }
  .tab-btn { font-size: 12px; font-weight: 500; padding: 10px 16px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .type-invoice { color: var(--text); }
  .type-credit { color: var(--green-text); }
  .type-payment { color: var(--accent); }
  .back-btn:hover { border-color: var(--border2); color: var(--text); }
  .tfoot-row td { font-size: 12px; color: var(--muted); background: var(--bg); }
  .auto-badge { font-size: 11px; padding: 3px 9px; border-radius: 12px; background: var(--green-bg); color: var(--green-text); }
  .pending-badge { font-size: 11px; color: var(--muted); }
  .section-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 500; }
  @media (max-width: 700px) { .kpi-row { grid-template-columns: repeat(2,1fr); } main { padding: 1rem; } }
</style>
</head>

if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadData();
}

const fmt = n => n == null ? '—' : '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const initials = name => name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function zoneLabel(z) {
  const labels = { current:'Current', yellow:'31–40 days', red:'41+ days' };
  return `<span class="zone-pill z-${z}"><span class="zdot"></span>${labels[z]}</span>`;
}

async function loadAsanaTasks() {
  // Load all existing tasks from AR Collections project and match to customers by name
  try {
    const res = await fetch(ANTHROPIC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: 'Fetch all incomplete tasks from Asana project ' + ASANA_PROJECT + '. Return ONLY a JSON array of objects: [{"name":"task name","gid":"123","url":"https://app.asana.com/..."}]. No other text.',
        messages: [{ role: 'user', content: 'List all incomplete tasks in AR Collections project ' + ASANA_PROJECT }],
        mcp_servers: [{ type: 'url', url: ASANA_MCP, name: 'asana' }]
      })
    });
    const json = await res.json();
    const text = json.content?.map(c => c.text||'').join('')||'';
    let tasks = [];
    try {
      const clean = text.replace(/```json|```/g,'').trim();
      tasks = JSON.parse(clean);
    } catch { return; }

    // Match tasks to customers by checking if task name starts with customer name
    if (!DATA) return;
    tasks.forEach(t => {
      const match = DATA.customers.find(c =>
        t.name && t.name.toLowerCase().startsWith(c.name.toLowerCase().substring(0, 15))
      );
      if (match && !asanaLinks[match.id]) {
        asanaLinks[match.id] = t.url || `https://app.asana.com/0/${ASANA_PROJECT}/${t.gid}`;
        autoCreated.add(match.id);
      }
    });
    render();
  } catch(e) { /* silent fail */ }
}

async function loadData() {
  try {
    const res = await fetch('data/ar_aging.json?t=' + Date.now());
    DATA = await res.json();
    render();
    loadAsanaTasks();
    triggerAutoTasks();
  } catch(e) {
    document.getElementById('app').innerHTML = `<div style="padding:3rem;text-align:center;color:var(--muted);">Could not load ar_aging.json — check GitHub Actions.</div>`;
  }
}

function kpis() {
  const c = DATA.customers;
  const totalAR   = c.reduce((s,x)=>s+x.total_ar,0);
  const current   = c.filter(x=>x.zone==='current').reduce((s,x)=>s+x.total_ar,0);
  const yellowAmt = c.filter(x=>x.zone==='yellow').reduce((s,x)=>s+x.overdue_amt,0);
  const redAmt    = c.filter(x=>x.zone==='red').reduce((s,x)=>s+x.overdue_amt,0);
  const yCount = c.filter(x=>x.zone==='yellow').length;
  const rCount = c.filter(x=>x.zone==='red').length;
  // Credit balances (negative open balances)
  // Credits from credit memos tracked in parse_ar.py
  const creditAll    = c.reduce((s,x)=>s+(x.credit_total||0),0);
  const creditCur    = c.filter(x=>x.zone==='current').reduce((s,x)=>s+(x.credit_total||0),0);
  const creditYellow = c.filter(x=>x.zone==='yellow').reduce((s,x)=>s+(x.credit_total||0),0);
  const creditRed    = c.filter(x=>x.zone==='red').reduce((s,x)=>s+(x.credit_total||0),0);
  const t = totalAR||1;
  const gP = Math.round((current/t)*100), yP = Math.round((yellowAmt/t)*100), rP = Math.max(1,Math.round((redAmt/t)*100));
  const fmtCredit = (n, label) => `<div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.07);"><span style="font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;">${label||'Credits'}</span><span style="display:block;font-size:13px;font-weight:600;color:${n<0?'var(--green-text)':'var(--muted)'}">${n<0?fmt(Math.abs(n)):'$0.00'}</span></div>`;
  return `
  <div class="kpi-row">
    <div class="kpi ${activeFilter==='all'?'kpi-active':''}" onclick="setFilter('all')" style="cursor:pointer;">
      <div class="kpi-label">Total AR</div>
      <div class="kpi-value">${fmt(totalAR)}</div>
      <div style="margin-top:4px;font-size:12px;color:var(--muted);">Net: <span style="color:var(--text);font-weight:500;">${fmt(totalAR + creditAll)}</span></div>
      ${fmtCredit(creditAll, 'Credits owed', 'all')}
    </div>
    <div class="kpi ${activeFilter==='current'?'kpi-active':''}" onclick="setFilter('current')" style="cursor:pointer;">
      <div class="kpi-label">Current</div>
      <div class="kpi-value">${fmt(current)}</div>
      ${fmtCredit(creditCur, 'Credits owed', 'current')}
    </div>
    <div class="kpi ${activeFilter==='yellow'?'kpi-active kpi-active-warn':''}" onclick="setFilter('yellow')" style="cursor:pointer;">
      <div class="kpi-label">Yellow zone <span style="font-size:10px;font-weight:400;">(31–40 days)</span></div>
      <div class="kpi-value warn">${fmt(yellowAmt)}<span class="kpi-sub">${yCount} accts</span></div>
      ${fmtCredit(creditYellow, 'Credits owed', 'yellow')}
    </div>
    <div class="kpi ${activeFilter==='red'?'kpi-active kpi-active-danger':''}" onclick="setFilter('red')" style="cursor:pointer;">
      <div class="kpi-label">Red zone <span style="font-size:10px;font-weight:400;">(41+ days)</span></div>
      <div class="kpi-value danger">${fmt(redAmt)}<span class="kpi-sub">${rCount} accts</span></div>
      ${fmtCredit(creditRed, 'Credits owed', 'red')}
    </div>
  </div>
  <div class="bar-wrap">
    <div class="bar-label-row">
      <span class="bar-legend"><span class="bar-dot" style="background:var(--green-dot)"></span>Current ${gP}%</span>
      <span class="bar-legend"><span class="bar-dot" style="background:var(--yellow-dot)"></span>Yellow ${yP}%</span>
      <span class="bar-legend"><span class="bar-dot" style="background:var(--red-dot)"></span>Red ${rP}%</span>
    </div>
    <div class="bar-row">
      <div class="bar-seg" style="flex:${gP};background:var(--green-dot);"></div>
      <div class="bar-seg" style="flex:${yP};background:var(--yellow-dot);margin-left:2px;"></div>
      <div class="bar-seg" style="flex:${rP};background:var(--red-dot);margin-left:2px;"></div>
    </div>
  </div>`;
}

let sortCol = null;
let sortDir = 'desc';

function setSort(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  } else {
    sortCol = col;
    sortDir = 'desc';
  }
  render();
}

function sortArrow(col) {
  if (sortCol !== col) return '<span style="opacity:0.3;margin-left:4px;">⇅</span>';
  return sortDir === 'desc'
    ? '<span style="margin-left:4px;color:var(--accent);">↓</span>'
    : '<span style="margin-left:4px;color:var(--accent);">↑</span>';
}

function listView() {
  let custs = DATA.customers;
  if (activeFilter !== 'all') custs = custs.filter(c=>c.zone===activeFilter);
  if (searchTerm) custs = custs.filter(c=>c.name.toLowerCase().includes(searchTerm.toLowerCase()));
  if (sortCol) {
    custs = [...custs].sort((a,b) => {
      const av = a[sortCol]||0, bv = b[sortCol]||0;
      return sortDir === 'desc' ? bv - av : av - bv;
    });
  }
  const rows = custs.map(c=>{
    const net = c.net_ar != null ? c.net_ar : c.total_ar;
    const hasCredit = (c.credit_total||0) < 0;
    const netColor = net < 0 ? 'var(--green-text)' : 'var(--text)';
    const netDisplay = hasCredit
      ? `<span style="color:${netColor};font-weight:500;">${net < 0 ? '(' + fmt(Math.abs(net)) + ')' : fmt(net)}</span>
         <span style="display:block;font-size:10px;color:var(--green-text);">incl. ${fmt(Math.abs(c.credit_total))} credit</span>`
      : fmt(net);
    return `
    <tr class="clickable" onclick="openCustomer('${c.id}')">
      <td style="font-weight:500;">${c.name}</td>
      <td class="tnum">${netDisplay}</td>
      <td class="tnum" style="color:${c.overdue_amt>0?(c.zone==='red'?'var(--red-text)':'var(--yellow-text)'):'var(--muted)'};">${c.overdue_amt>0?fmt(c.overdue_amt):'—'}</td>
      <td class="tr" style="color:${c.max_days_past_due===0?'var(--muted)':c.zone==='red'?'var(--red-text)':'var(--yellow-text)'};font-weight:${c.max_days_past_due>0?600:400};">${c.max_days_past_due===0?'—':c.max_days_past_due+' days'}</td>
      <td>${zoneLabel(c.zone)}</td>
      <td class="tr"><span class="chev">›</span></td>
    </tr>`;}).join('');
  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <div class="search"><input type="text" id="cust-search" placeholder="Search customer..." oninput="onSearch(this.value)" autocomplete="off"></div>
  </div>
  <div class="card">
    <table>
      <thead><tr>
        <th style="width:30%;">Customer</th>
        <th class="tnum" style="width:16%;cursor:pointer;user-select:none;" onclick="setSort('net_ar')">Net AR${sortArrow('net_ar')}</th>
        <th class="tnum" style="width:16%;cursor:pointer;user-select:none;" onclick="setSort('overdue_amt')">Overdue${sortArrow('overdue_amt')}</th>
        <th class="tr" style="width:14%;cursor:pointer;user-select:none;" onclick="setSort('max_days_past_due')">Max past due${sortArrow('max_days_past_due')}</th>
        <th style="width:14%;">Zone</th>
        <th style="width:10%;">Asana task</th>
        <th style="width:6%;"></th>
      </tr></thead>
      <tbody id="cust-tbody">${rows||'<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--muted);">No customers match.</td></tr>'}</tbody>
    </table>
  </div>`;
}

let detailTab = 'all';

function detailView(id) {
  const c = DATA.customers.find(x=>x.id===id);
  if (!c) return '';
  const hasPending = (c.zone==='yellow'||c.zone==='red')&&!autoCreated.has(c.id);
  const taskBadge = asanaLinks[c.id]
    ? `<a href="${asanaLinks[c.id]}" target="_blank" style="text-decoration:none;"><span class="auto-badge" style="cursor:pointer;">✓ Asana task ↗</span></a>`
    : autoCreated.has(c.id) ? `<span class="pending-badge">Creating task…</span>`
    : hasPending ? `<span class="pending-badge">Creating task…</span>` : '';

  const txns = c.transactions || [];
  const filtered = detailTab === 'all' ? txns
    : detailTab === 'invoices' ? txns.filter(t=>t.type==='Invoice')
    : detailTab === 'credits'  ? txns.filter(t=>t.type==='Credit Memo')
    : txns.filter(t=>t.type==='Payment');

  const typeClass = t => t.type==='Invoice' ? 'type-invoice' : t.type==='Credit Memo' ? 'type-credit' : 'type-payment';
  const typeBadge = t => {
    if (t.type==='Invoice')     return `<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.06);color:var(--muted);">Invoice</span>`;
    if (t.type==='Credit Memo') return `<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:var(--green-bg);color:var(--green-text);">Credit Memo</span>`;
    if (t.type==='Payment')     return `<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(0,212,170,0.1);color:var(--accent);">Payment</span>`;
    return t.type;
  };

  const txnRows = filtered.map(t=>`
    <tr>
      <td>${typeBadge(t)}</td>
      <td style="color:var(--muted);font-size:12px;">${t.id||'—'}</td>
      <td style="color:var(--muted);">${t.date||'—'}</td>
      <td style="color:var(--muted);">${t.due_date||'—'}</td>
      <td class="tnum ${typeClass(t)}">${t.type==='Payment'?'('+fmt(Math.abs(t.amount))+')':fmt(Math.abs(t.amount))}</td>
      <td class="tnum" style="color:${t.open_balance<0?'var(--green-text)':t.open_balance===0?'var(--muted)':'var(--text)'};">${fmt(t.open_balance)}</td>
    </tr>`).join('');

  const counts = {
    all: txns.length,
    invoices: txns.filter(t=>t.type==='Invoice').length,
    credits:  txns.filter(t=>t.type==='Credit Memo').length,
    payments: txns.filter(t=>t.type==='Payment').length,
  };

  const tab = key => `<button class="tab-btn ${detailTab===key?'active':''}" onclick="setDetailTab('${id}','${key}')">${key.charAt(0).toUpperCase()+key.slice(1)} (${counts[key]})</button>`;

  return `
  <button class="back-btn" onclick="goBack()">← All customers</button>
  <div class="card">
    <div class="detail-header">
      <div class="avatar av-${c.zone}">${initials(c.name)}</div>
      <div>
        <div class="detail-name">${c.name}</div>
        <div class="detail-sub">Net AR: ${fmt(c.net_ar != null ? c.net_ar : c.total_ar)} &nbsp;·&nbsp; Invoices: ${fmt(c.total_ar)} &nbsp;·&nbsp; Credits: <span style="color:var(--green-text);">${fmt(Math.abs(c.credit_total||0))}</span> &nbsp;·&nbsp; Overdue: ${fmt(c.overdue_amt)}</div>
      </div>
      <div class="detail-meta" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          ${zoneLabel(c.zone)}${taskBadge}
        </div>
        <button onclick="event.stopPropagation();manualCreateTask('${c.id}')"
          style="font-size:11px;padding:5px 12px;border:1px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);cursor:pointer;">
          + Create Asana Task
        </button>
        <div id="manual-task-status"></div>
      </div>
    </div>
    <div class="tab-row">
      ${tab('all')}${tab('invoices')}${tab('credits')}${tab('payments')}
    </div>
    <table>
      <thead><tr>
        <th style="width:14%;">Type</th>
        <th style="width:18%;">Number</th>
        <th style="width:13%;">Date</th>
        <th style="width:13%;">Due date</th>
        <th class="tnum" style="width:14%;">Amount</th>
        <th class="tnum" style="width:14%;">Open balance</th>
      </tr></thead>
      <tbody>${txnRows||'<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--muted);">No transactions in this view.</td></tr>'}</tbody>
    </table>
    <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;color:var(--muted);">
      <span>${counts.invoices} invoice${counts.invoices!==1?'s':''} · ${counts.credits} credit${counts.credits!==1?'s':''} · ${counts.payments} payment${counts.payments!==1?'s':''}</span>
      <span style="font-weight:600;color:var(--text);">Net open: ${fmt(c.total_ar + (c.credit_total||0))}</span>
    </div>
  </div>`;
}

function manualCreateTask(custId) {
  const cust = DATA.customers.find(c => c.id === custId);
  if (!cust) return;
  const el = document.getElementById('manual-task-status');
  if (el) el.innerHTML = '<span style="color:var(--muted);font-size:12px;">Creating task…</span>';
  // Force re-create even if already created
  autoCreated.delete(custId);
  delete asanaLinks[custId];
  createAsanaTask(cust, 'manual');
}

function setDetailTab(custId, tab) {
  detailTab = tab;
  document.getElementById('app').innerHTML = kpis() + detailView(custId);
  setTimeout(setCreditLabels, 0);
}

function setCreditLabels() {
  if (!DATA) return;
  const c = DATA.customers;
  const calc = (arr) => arr.reduce((s,x)=>s+x.invoices.filter(i=>i.open_balance<0).reduce((a,i)=>a+i.open_balance,0),0);
  const sets = {
    'all': c, 'current': c.filter(x=>x.zone==='current'),
    'yellow': c.filter(x=>x.zone==='yellow'), 'red': c.filter(x=>x.zone==='red')
  };
  for (const [k,arr] of Object.entries(sets)) {
    const el = document.getElementById('kpi-credit-'+k);
    if (!el) continue;
    const cr = calc(arr);
    el.textContent = cr < 0 ? 'Credit: ' + fmt(Math.abs(cr)) : '';
  }
}

function render() {
  if (!DATA) return;
  document.getElementById('last-updated').textContent = 'Data as of ' + DATA.generated;
  document.getElementById('app').innerHTML = kpis() + (view==='list' ? listView() : detailView(selectedId));
  setTimeout(setCreditLabels, 0);
  if (view === 'list') {
    const si = document.getElementById('cust-search');
    if (si && searchTerm) {
      si.value = searchTerm;
      // Re-apply filter after render
      onSearch(searchTerm);
    }
  }
}

function openCustomer(id) { view='detail'; selectedId=id; render(); }
function goBack()         { view='list'; selectedId=null; render(); }
function setFilter(f)     { activeFilter=f; render(); }
function onSearch(v) {
  searchTerm = v.toLowerCase();
  const rows = document.querySelectorAll('#cust-tbody tr');
  rows.forEach(row => {
    const name = row.querySelector('td') ? row.querySelector('td').textContent.toLowerCase() : '';
    row.style.display = name.includes(searchTerm) ? '' : 'none';
  });
}

// ── ASANA TASK CREATION ──

function nextBusinessDay() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toISOString().split('T')[0];
}

// mode: 'auto' = triggered by zone detection, 'manual' = button click from detail view
async function createAsanaTask(cust, mode='auto') {
  const isManual = mode === 'manual';
  if (!isManual && autoCreated.has(cust.id)) return;
  autoCreated.add(cust.id);

  // Routing rules
  // Auto:   yellow → Yellow Zone section, Medium priority
  // Auto:   red    → Red Zone section,    High priority
  // Manual: any    → General AR Tasks,    Medium priority (no auto-override)
  const section  = isManual ? ASANA_GEN_SEC
                 : cust.zone === 'red' ? ASANA_RED_SEC : ASANA_YEL_SEC;
  const priority = (!isManual && cust.zone === 'red') ? ASANA_PRI_HIGH : ASANA_PRI_MED;
  const dueStr   = nextBusinessDay();

  // Build full notes
  const txns     = cust.transactions || [];
  const invoices = txns.filter(t => t.type === 'Invoice');
  const credits  = txns.filter(t => t.type === 'Credit Memo');
  const payments = txns.filter(t => t.type === 'Payment');
  const openMap  = {};
  (cust.invoices||[]).filter(i=>i.days_past_due>0).forEach(i => openMap[i.id] = i.days_past_due);
  const fmtA = n => '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const div  = '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━';
  const net  = cust.net_ar != null ? cust.net_ar : (cust.total_ar + (cust.credit_total||0));

  const invLines = invoices.map(i =>
    `  • ${i.id} | Inv date: ${i.date||'—'} | Due: ${i.due_date||'—'} | Amount: ${fmtA(i.amount)} | Open: ${fmtA(i.open_balance)}` +
    (openMap[i.id] ? ` | PAST DUE ${openMap[i.id]} days` : '')
  ).join('\n') || '  None';

  const crLines  = credits.map(c  => `  • ${c.id} | Date: ${c.date||'—'} | Credit: ${fmtA(c.amount)}`).join('\n') || '  None';
  const payLines = payments.map(p => `  • ${p.id} | Date: ${p.date||'—'} | Payment: ${fmtA(Math.abs(p.amount))}`).join('\n') || '  None';
  const creditNote = (cust.credit_total||0) < 0
    ? `\nNOTE: Customer has ${fmtA(Math.abs(cust.credit_total))} in unapplied credits. Verify if these should be applied before collecting.`
    : '';

  const notes = `${div}
CUSTOMER: ${cust.name}
ZONE: ${cust.zone.toUpperCase()} — ${cust.max_days_past_due} days past due
${div}

ACCOUNT SUMMARY
  Gross AR (invoices):   ${fmtA(cust.total_ar)}
  Unapplied credits:    -${fmtA(Math.abs(cust.credit_total||0))}
  Net AR owed:           ${fmtA(net)}
  Overdue balance:       ${fmtA(cust.overdue_amt)}

${div}
INVOICES (${invoices.length} total)
${invLines}

${div}
CREDIT MEMOS (${credits.length} total)
${crLines}

${div}
PAYMENTS (${payments.length} total)
${payLines}

${div}
ACTION REQUIRED
Contact ${cust.name} to collect past due balance of ${fmtA(cust.overdue_amt)}.${creditNote}
Data as of: ${DATA.generated}`;

  const taskName = `${cust.name} - ${fmtA(cust.overdue_amt)} - ${cust.max_days_past_due} days`;

  try {
    // Step 1: Create the task via Anthropic API + Asana MCP
    const res = await fetch(ANTHROPIC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        system: `You create Asana tasks. Use the Asana MCP tool to create a task with EXACTLY these parameters and respond with ONLY JSON {"gid":"..."} using the actual GID returned:
- name: as provided
- notes: as provided
- assignee: ${ASANA_ASSIGNEE}
- due_on: ${dueStr}
- projects with memberships: project=${ASANA_PROJECT}, section=${section}
- custom_fields: {${ASANA_PRIORITY_FLD}: "${priority}"}`,
        messages: [{ role: 'user', content:
          `Create task:\nName: "${taskName}"\nDue: ${dueStr}\nNotes: "${notes.substring(0,500)}..."`
        }],
        mcp_servers: [{ type: 'url', url: ASANA_MCP, name: 'asana' }]
      })
    });

    const json = await res.json();
    const text = json.content?.map(c => c.text||'').join('')||'';

    // Extract GID from response
    let taskGid = null;
    try {
      const obj = JSON.parse(text);
      taskGid = obj.gid;
    } catch {
      const m = text.match(/"gid"\s*:\s*"(\d+)"/);
      if (m) taskGid = m[1];
    }

    if (taskGid) {
      asanaLinks[cust.id] = `https://app.asana.com/0/${ASANA_PROJECT}/${taskGid}`;
    }

    render();

    if (isManual) {
      const el = document.getElementById('manual-task-status');
      if (el) el.innerHTML = asanaLinks[cust.id]
        ? `<a href="${asanaLinks[cust.id]}" target="_blank" style="color:var(--green-text);font-size:12px;">✓ Task created — view in Asana ↗</a>`
        : `<span style="color:var(--green-text);font-size:12px;">✓ Task created in Asana</span>`;
    }

  } catch(e) {
    autoCreated.delete(cust.id);
    if (isManual) {
      const el = document.getElementById('manual-task-status');
      if (el) el.innerHTML = `<span style="color:var(--red-text);font-size:12px;">⚠ Error: ${e.message}</span>`;
    }
  }
}

async function autoCreateTask(cust) {
  if (autoCreated.has(cust.id)) return;
  await createAsanaTask(cust, false);
}

function openCreditPanel(zone) {
  if (!DATA) return;
  const zoneLabels = { all:'All customers', current:'Current', yellow:'Yellow zone (31–40 days)', red:'Red zone (41+ days)' };
  let customers = DATA.customers.filter(c => (c.credit_total||0) < 0);
  if (zone !== 'all') customers = customers.filter(c => c.zone === zone);
  customers = customers.sort((a,b) => a.credit_total - b.credit_total);
  const total = customers.reduce((s,c) => s+(c.credit_total||0), 0);

  // Build rows — each customer expands to show individual credit memos
  const rows = customers.map(c => {
    const memos = (c.credit_memos||[]);
    const memoRows = memos.map(m => `
      <tr style="background:rgba(0,0,0,0.15);">
        <td style="padding:6px 14px 6px 28px;font-size:12px;color:var(--muted);">${m.id}</td>
        <td style="padding:6px 14px;font-size:12px;color:var(--muted);">${m.date||'—'}</td>
        <td style="padding:6px 14px;font-size:12px;color:var(--muted);"></td>
        <td style="padding:6px 14px;text-align:right;font-size:12px;color:var(--green-text);">$${m.amount.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      </tr>`).join('');
    return `
      <tr class="credit-cust-row" onclick="toggleCreditMemos('${c.id}')" style="cursor:pointer;">
        <td style="font-weight:500;">${c.name} <span id="arrow-${c.id}" style="font-size:10px;color:var(--muted);">▶</span></td>
        <td>${zoneLabel(c.zone)}</td>
        <td style="font-size:12px;color:var(--muted);text-align:center;">${memos.length} memo${memos.length!==1?'s':''}</td>
        <td class="credit-amt">${fmt(Math.abs(c.credit_total||0))}</td>
      </tr>
      <tbody id="memos-${c.id}" style="display:none;">${memoRows}</tbody>`;
  }).join('');

  const panel = document.createElement('div');
  panel.className = 'credit-panel-overlay';
  panel.id = 'credit-panel-overlay';
  panel.onclick = (e) => { if(e.target === panel) closeCreditPanel(); };
  panel.innerHTML = `
    <div class="credit-panel">
      <div class="credit-panel-header">
        <div>
          <div class="credit-panel-title">Credits owed — ${zoneLabels[zone]||'All'}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${customers.length} customer${customers.length!==1?'s':''} · click a row to see memo detail</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="credit-panel-total">Total: ${fmt(Math.abs(total))}</span>
          <button class="credit-panel-close" onclick="closeCreditPanel()">✕</button>
        </div>
      </div>
      <div class="credit-panel-body">
        <table>
          <thead><tr>
            <th style="width:40%;">Customer</th>
            <th style="width:20%;">Zone</th>
            <th style="width:15%;text-align:center;">Memos</th>
            <th style="width:25%;text-align:right;">Total credit</th>
          </tr></thead>
          <tbody id="cust-tbody">${rows||'<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--muted);">No credits in this zone.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
  document.body.appendChild(panel);
}

function toggleCreditMemos(custId) {
  const body = document.getElementById('memos-' + custId);
  const arrow = document.getElementById('arrow-' + custId);
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'table-row-group';
  if (arrow) arrow.textContent = isOpen ? '▶' : '▼';
}

function closeCreditPanel() {
  const p = document.getElementById('credit-panel-overlay');
  if (p) p.remove();
}

function triggerAutoTasks() {
  DATA.customers.forEach(c => { if ((c.zone==='yellow'||c.zone==='red') && !autoCreated.has(c.id)) autoCreateTask(c); });
}
</script>
</body>
</html>
